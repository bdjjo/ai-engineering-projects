[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "constitutional-ai-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.7.1", "transformers==4.51.3", "peft==0.15.2", "accelerate==1.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]
