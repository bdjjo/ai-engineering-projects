name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            project: 01-gpt2-from-scratch
          - os: ubuntu-latest
            python: '3.12'
            project: 01-gpt2-from-scratch
          - os: windows-latest
            python: '3.12'
            project: 01-gpt2-from-scratch
          - os: ubuntu-latest
            python: '3.12'
            project: 02-dpo-training-pipeline
          - os: ubuntu-latest
            python: '3.12'
            project: 03-mechanistic-interpretability
          - os: windows-latest
            python: '3.12'
            project: 03-mechanistic-interpretability
          - os: ubuntu-latest
            python: '3.12'
            project: 04-distributed-llm-training
          - os: windows-latest
            python: '3.12'
            project: 04-distributed-llm-training
          - os: ubuntu-latest
            python: '3.12'
            project: 05-constitutional-ai
          - os: windows-latest
            python: '3.12'
            project: 05-constitutional-ai
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/requirements*.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Check code
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test math, data, and checkpoint recovery
        run: python -m pytest -q
      - name: Exercise SFT and DPO adapter training
        if: matrix.project == '02-dpo-training-pipeline'
        run: python scripts/smoke.py
      - name: Verify two-process DDP and distributed checkpoint recovery
        if: matrix.project == '04-distributed-llm-training'
        run: python scripts/verify_distributed.py
